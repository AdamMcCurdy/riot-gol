name: Conway's Game of Life Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Verify build output (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $buildDir = "${{ steps.strings.outputs.build-output-dir }}"
          $exePath = Join-Path -Path $buildDir -ChildPath "${{ matrix.build_type }}" -AdditionalChildPath "riot_gol.exe"
          
          Write-Host "Build directory: $buildDir"
          Write-Host "Checking for executable at: $exePath"
          
          if (Test-Path $exePath) {
              Write-Host "Executable found at: $exePath"
          } else {
              Write-Host "Executable not found. Listing build directory contents:"
              Get-ChildItem -Path $buildDir -Recurse | Select-Object FullName
              exit 1
          }

      - name: Verify build output (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          buildDir="${{ steps.strings.outputs.build-output-dir }}"
          exePath="$buildDir/riot_gol"
          
          echo "Build directory: $buildDir"
          echo "Checking for executable at: $exePath"
          
          if [ -f "$exePath" ]; then
              echo "Executable found at: $exePath"
          else
              echo "Executable not found. Listing build directory contents:"
              find "$buildDir" -type f
              exit 1
          fi

      - name: Create Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $buildDir = "${{ steps.strings.outputs.build-output-dir }}"
          $packageDir = Join-Path -Path $buildDir -ChildPath "package"
          $exePath = Join-Path -Path $buildDir -ChildPath "${{ matrix.build_type }}" -AdditionalChildPath "riot_gol.exe"
          $samplePath = "${{ github.workspace }}/sample_input.txt"
          
          # Create package directory
          New-Item -ItemType Directory -Path $packageDir -Force
          
          # Copy files to package directory
          Copy-Item -Path $exePath -Destination $packageDir
          Copy-Item -Path $samplePath -Destination $packageDir
          
          # Create ZIP package
          Compress-Archive -Path "$packageDir/*" -DestinationPath "$buildDir/riot_gol_windows.zip" -Force

      - name: Create Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          buildDir="${{ steps.strings.outputs.build-output-dir }}"
          packageDir="$buildDir/package"
          exePath="$buildDir/riot_gol"
          samplePath="${{ github.workspace }}/sample_input.txt"
          
          # Create package directory
          mkdir -p "$packageDir"
          
          # Copy files to package directory
          cp "$exePath" "$packageDir/"
          cp "$samplePath" "$packageDir/"
          
          # Create ZIP package
          cd "$packageDir"
          zip -r "$buildDir/riot_gol_linux.zip" ./*

      - name: Upload Complete Package
        uses: actions/upload-artifact@v4
        with:
          name: riot-gol-package-${{ matrix.os }}
          path: ${{ steps.strings.outputs.build-output-dir }}/riot_gol_${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}.zip